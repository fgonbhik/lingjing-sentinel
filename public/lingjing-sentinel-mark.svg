      <stop stop-color="#123F69"/>
      <stop offset="1" stop-color="#041620"/>
    </linearGradient>
    <linearGradient id="brand-line" x1="24" y1="18" x2="72" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BFAFF"/>
      <stop offset=".55" stop-color="#39DFF2"/>
      <stop offset="1" stop-color="#2787FF"/>
