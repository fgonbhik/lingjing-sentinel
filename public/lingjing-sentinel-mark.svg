  <circle cx="48" cy="23" r="3" fill="#83FFEC" filter="url(#brand-glow)"/>
  <path d="M13 31v-8l10-10h8M83 65v8L73 83h-8" fill="none" stroke="#53D8EA" stroke-width="2" opacity=".75"/>
